# Compass API — Cloudflare Worker, for local development.
#
# This runs the API as a standalone Worker (`npm run dev` → wrangler dev on
# :8787, which the Vite dev server proxies /api to), and it is also what
# vitest.config.ts reads its bindings from, so a test cannot pass under a
# configuration the deployed app does not have.
#
# It is NOT the deployed configuration. Phase 7 puts the API on Cloudflare
# Pages, which reads the repo root's wrangler.toml instead — Pages will not
# take a config from a subdirectory. That means compatibility_date, the
# compatibility flags and the DB binding below exist in both files and have to
# be changed in both; there is no import mechanism between them. The root file
# says the same thing from its side.
#
# `name` is therefore a local-only label: nothing is ever deployed as
# "compass-api". The deployed project is "compass-web".

name = "compass-api"
main = "src/index.ts"
compatibility_date = "2026-08-01"

# The Anthropic and OpenAI SDKs pull in a few Node built-in shims (streams,
# buffer). This flag is what makes those resolve inside the isolate; without it
# the bundle fails at build time rather than at runtime.
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "compass-db"
# Stays a placeholder forever. Local `wrangler dev` ignores it and uses a
# SQLite file under .wrangler/state, and nothing deploys from this file — the
# real production and preview ids live in the root wrangler.toml, which is
# also the only place remote migrations can be applied from.
database_id = "local-only-never-deployed"
migrations_dir = "migrations"

[vars]
# Comma-separated browser origins allowed to call this API. The Vite dev server
# on :5173 is the only origin this local Worker ever answers; the deployed
# value lives in the root wrangler.toml. Same allowlist decision as the Express
# build, just read from a Worker var instead of process.env.
CORS_ORIGIN = "http://localhost:5173"

# Lowest level that reaches the log: debug | info | warn | error | silent.
# "info" gives one line per request plus every warning and error; "debug" adds
# the health-check traffic the request logger otherwise keeps out of the way.
# It is a var rather than a secret precisely so it can be changed in the
# dashboard mid-incident without a redeploy.
LOG_LEVEL = "info"

# ANTHROPIC_API_KEY / OPENAI_API_KEY are secrets, never vars — set them in
# .dev.vars locally (gitignored) and with `wrangler secret put` in production.
# With neither set the chatbot runs its offline fallback.
