<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Compass — a guidance-counselor-in-your-pocket that helps high school students build a balanced, personalized college list and answers admissions and financial-aid questions."
    />
    <title>Compass — College Admissions Advisor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Apply the saved theme before first paint so dark mode never flashes light. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("compass-theme");
          var theme =
            saved ||
            (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {}
      })();
      // TEMPORARY — picking a warmer night palette. ?night=dusk|ember|slate
      // selects one of the preview blocks in global.css; ?night=off or no
      // parameter is the current teal. Remove this, the stored key, and the
      // preview blocks once one of them wins.
      (function () {
        try {
          var pick = new URLSearchParams(location.search).get("night");
          if (pick) localStorage.setItem("compass-night", pick);
          var night = localStorage.getItem("compass-night");
          if (night && night !== "off") {
            document.documentElement.setAttribute("data-night", night);
          } else {
            document.documentElement.removeAttribute("data-night");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
