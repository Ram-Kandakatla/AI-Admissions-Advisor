<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Compass">
  <!--
    The app's compass rose, redrawn for a 16px tab.

    BrandMark.tsx is the same mark as line art whose colours come from the
    theme tokens. Neither of those survives here: a favicon is fetched as a
    standalone document, so it can see no CSS variable from the page, and a
    1.5px stroke on a 16px canvas turns to grey mush. So this is a solid disc
    with two filled needles — two shapes, high contrast, no strokes to lose.

    The disc is the app's ink and the north needle is the periwinkle the dark
    theme uses for its accent, rather than the light theme's darker blue: the
    needle has to read against the ink, and this is the pair that does. The
    hairline ring is the one concession to a dark tab strip, where the disc
    would otherwise have no edge at all.
  -->
  <circle cx="16" cy="16" r="16" fill="#14262d"/>
  <circle cx="16" cy="16" r="15.25" fill="none" stroke="#3d5566" stroke-width="1.1"/>
  <path d="M16 4.6 L20.1 15.1 L16 16 L11.9 15.1 Z" fill="#93b4f7"/>
  <path d="M16 27.4 L11.9 16.9 L16 16 L20.1 16.9 Z" fill="#6d8794"/>
</svg>
